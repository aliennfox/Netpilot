name: NetPilot
options:
  bundleIdPrefix: com.foxnetpilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

targets:
  NetPilot:
    type: application
    platform: iOS
    sources:
      - NetPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxnetpilot.NetPilot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NetPilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    info:
      path: NetPilot/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
