# 脱敏 Clash / Clash.Meta 订阅样本 (M13 矩阵回归用)
# 所有 UUID / password / 域名均为 example.com 假数据
mixed-port: 7890
mode: rule
log-level: info

proxies:
  - name: "SS-HK-01"
    type: ss
    server: ss.example.com
    port: 8388
    cipher: aes-256-gcm
    password: ss-password-fake
    udp: true

  - name: "VMess-WS-JP"
    type: vmess
    server: vmess.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000001
    alterId: 0
    cipher: auto
    tls: true
    servername: vmess.example.com
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: vmess.example.com

  - name: "VLESS-Reality-US"
    type: vless
    server: reality.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000002
    network: tcp
    flow: xtls-rprx-vision
    tls: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: xMpLXlskDipwWGjPsxVInUSpd-fjCCYgb8mIOYbZipk
      short-id: fc46e73c

  - name: "Trojan-SG"
    type: trojan
    server: trojan.example.com
    port: 443
    password: trojan-fake-pw
    sni: trojan.example.com
    alpn: [h2, http/1.1]

  - name: "Hy2-TW"
    type: hysteria2
    server: hy2.example.com
    port: 443
    password: hy2-fake-pw
    sni: hy2.example.com
    obfs: salamander
    obfs-password: fake-obfs

  - name: "TUIC-KR"
    type: tuic
    server: tuic.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000003
    password: tuic-fake-pw
    sni: tuic.example.com
    congestion-controller: bbr
    udp-relay-mode: native
    alpn: [h3]

  - name: "AnyTLS-AU"
    type: anytls
    server: anytls.example.com
    port: 443
    password: anytls-fake-pw
    sni: anytls.example.com
    client-fingerprint: chrome

  - name: "SOCKS5-Home"
    type: socks5
    server: socks5.example.com
    port: 1080
    username: user-fake
    password: socks-fake-pw
    udp: true

  - name: "HTTPS-Corp"
    type: http
    server: https.example.com
    port: 443
    tls: true
    sni: https.example.com
    username: user-fake
    password: https-fake-pw
    skip-cert-verify: false

  - name: "WG-JP"
    type: wireguard
    server: wg.example.com
    port: 51820
    private-key: OOU+v9ZLILc43E2ZQVgGfI6hs9o4ut7UjCNzP7gQQG8=
    public-key: xMpLXlskDipwWGjPsxVInUSpd+fjCCYgb8mIOYbZipk=
    ip: 10.0.0.2
    mtu: 1420
    reserved: [0, 0, 0]

proxy-groups:
  - name: PROXY
    type: select
    proxies: [SS-HK-01, VMess-WS-JP, VLESS-Reality-US, SOCKS5-Home, HTTPS-Corp, WG-JP]

rules:
  - MATCH,PROXY
